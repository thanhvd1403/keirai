# Keirai configuration - TOML, comments allowed.
# Copy to config.toml and fill in your values.
# Env overrides: KEIRAI_BOT_TOKEN, KEIRAI_ZEN_API_KEY, KEIRAI_GO_API_KEY

bot_token = "123456:ABC-DEF..."          # from @BotFather

# allowed users: list of Telegram user IDs / usernames, or "all"
# allowed_users = "all"
allowed_users = [42, "someusername"]

thinking_default = true                  # show AI reasoning by default
default_model = "zen/glm-5.3-flash"      # provider/model-id
max_file_mb = 20                         # download size cap
system_prompt = """You are Keirai, a lightweight AI agent running on a small server. Answer using markdown."""

[providers.zen]
api_key = ""                             # from opencode.ai console

[providers.go]
api_key = ""                             # only if you have an OpenCode Go subscription
